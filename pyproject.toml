[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-tivm"
version = "1.0.0"
description = "Coupled Multiscale Epidemic ODE Solver for Viral Kinetics and Macro Transmission"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nikassh Bala", email = "nikassh@example.com"}
]
dependencies = [
    "scipy>=1.9.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "pandas>=1.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]
